name: Testes JavaScript (Jest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test

      - name: Upload test results (GitHub Actions Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: ./jest/